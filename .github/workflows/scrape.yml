name: Tomar snapshot de precios

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      forzar:
        description: "Ignorar el intervalo de 7 días"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scrape-precios
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-scraper.txt

      - name: Instalar dependencias
        run: |
          pip install -r requirements-scraper.txt
          python -m playwright install --with-deps chromium

      - name: Descargar precios
        run: python scraper.py ${{ inputs.forzar == true && '--forzar' || '' }}

      - name: Guardar snapshots en el repositorio
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add datos/
          if git diff --cached --quiet; then
            echo "Sin cambios para guardar"
          else
            git commit -m "Snapshot de precios $(date -u +%F)"
            git pull --rebase
            git push
          fi
